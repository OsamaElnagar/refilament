laravel: '@testbench'

env:
  # Dev app key for the serve path. Tests mirror it in TestCase::defineEnvironment.
  APP_KEY: 'base64:zYxR6/Vy/APuB1HLXWfsn+bewgcSH7a8bNxk37vnkO0='

providers:
  - Inertia\ServiceProvider
  - Laravel\Fortify\FortifyServiceProvider
  - Refilament\Refilament\RefilamentServiceProvider
  - Workbench\App\Providers\WorkbenchServiceProvider
  - Workbench\App\Providers\RefilamentDefaultsServiceProvider

migrations:
  - workbench/database/migrations

seeders:
  - Workbench\Database\Seeders\DatabaseSeeder

workbench:
  start: '/'
  install: true
  health: false
  discovers:
    web: true
    api: true
    commands: true
    components: false
    factories: true
    views: true
  build:
    - asset-publish
    - create-sqlite-db
    - db-wipe
    - migrate-fresh
  assets:
    - laravel-assets
  sync:
    - from: storage
      to: workbench/storage
      reverse: true
